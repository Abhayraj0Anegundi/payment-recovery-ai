services:
  - type: web
    name: payment-recovery-ai
    runtime: python
    plan: free
    rootDir: .
    buildCommand: >
      cd frontend && npm install && npm run build &&
      cd ../backend && pip install -r requirements.txt
    # Deliberately 1 worker, not 2+: this app has two things that only work
    # correctly within a single process — the in-memory rate limiter
    # (api.py's _rate_limit_hits dict) and the single-file SQLite database.
    # Multiple gunicorn workers are separate OS processes, each with its own
    # copy of that dict, so a 2-worker setup silently made the rate limiter
    # ~2x less effective and non-deterministic about which "bucket" a
    # request landed in (found via live testing — 12 rapid requests all
    # succeeded when the 11th+ should have been rate-limited). --threads
    # gives real concurrency for the I/O-bound Gemini/Razorpay calls without
    # that problem, since threads share the same process memory.
    # --timeout 120, not gunicorn's default/a tighter value: on Render's free
    # tier (shared, limited CPU), a single Gemini API call can occasionally
    # take long enough — especially right after a cold boot — that a 60s
    # worker timeout kills the request before Gemini responds, surfacing as
    # a 500 with no Python traceback in the app logs (gunicorn's own SIGKILL,
    # not an application exception). Seen directly while stress-testing this
    # deployment. 120s doesn't fix a slow Gemini call, it just stops
    # gunicorn from being the thing that kills it first.
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 api:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
